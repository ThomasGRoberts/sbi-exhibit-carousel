<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f5f3">
  <title>Slide 23 content preview · ESPL</title>
  <link rel="stylesheet" href="../../animations/under-the-hood.css">
  <link rel="stylesheet" href="./preview.css">
  <script type="module" src="./preview.js?v=all-visible-1"></script>
</head>
<body>
  <div class="preview">
    <header class="toolbar">
      <a class="back" href="../../">←&nbsp; Back to carousel</a>
      <span class="toolbar-label">Slide 23 content study <span aria-hidden="true">·</span> local preview</span>
      <button class="fullscreen" id="fullscreen" type="button" aria-label="Enter full screen" title="Enter full screen">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9V4h5m6 0h5v5M4 15v5h5m6 0h5v-5"/></svg>
      </button>
    </header>

    <main class="stage">
      <section class="slide" id="slide" tabindex="0"
        aria-label="Slide 23 process diagram">
        <img class="logo" src="../../assets/ESPL.png" alt="" aria-hidden="true">
      </section>
    </main>

  </div>
</body>
</html>
